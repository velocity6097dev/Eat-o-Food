<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Welcome</title>
<link rel="stylesheet" href="css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  .hero {
    padding: 48px 24px 24px;
    text-align: center;
  }
  .hero h1 { font-size: 30px; margin-bottom: 6px; }
  .hero p { color: var(--color-ink-soft); font-size: 15px; margin: 0; }
  .form-wrap { padding: 8px 24px 40px; }
  .table-icon {
    width: 72px; height: 72px; border-radius: 20px;
    background: var(--color-primary);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .field-label { font-weight: 600; font-size: 14px; margin-bottom: 8px; display: block; }
  .error-msg { color: var(--color-danger); font-size: 14px; margin-top: 10px; min-height: 18px; }
  .continue-card { text-align: center; padding: 24px; }
  .continue-table-num { font-size: 34px; font-weight: 800; color: var(--color-primary); margin: 6px 0 18px; }
  .switch-link { background: none; color: var(--color-ink-soft); font-size: 13.5px; text-decoration: underline; margin-top: 14px; }
</style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="table-icon">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M3 8h18M3 8l1.5 12h15L21 8M3 8l2-5h14l2 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 id="shopName" class="display">Welcome</h1>
      <p id="shopAddress">Loading...</p>
    </div>
    <div class="form-wrap" id="formWrap">
      <div class="card" id="entryCard">
        <label class="field-label" for="tableInput">Enter your table number</label>
        <input class="input" id="tableInput" type="text" inputmode="numeric" placeholder="e.g. 12" autofocus>
        <div class="error-msg" id="errorMsg"></div>
        <button class="btn btn-primary btn-block" style="margin-top:14px" id="continueBtn">Continue to Menu</button>
      </div>
    </div>
  </div>

<script src="js/api.js"></script>
<script>
(async function() {
  const shop = await applyShopTheme();
  listenForShopUpdates();
  if (shop) {
    document.getElementById('shopName').textContent = shop.name;
    document.getElementById('shopAddress').textContent = shop.address;
  }

  const params = new URLSearchParams(window.location.search);
  const prefill = params.get('table');
  const forceNew = params.get('newtable') === '1';
  const existingTable = getTable();

  const btn = document.getElementById('continueBtn');
  const input = document.getElementById('tableInput');
  const errorMsg = document.getElementById('errorMsg');

  async function submit() {
    const tableNumber = input.value.trim();
    errorMsg.textContent = '';
    if (!tableNumber) {
      errorMsg.textContent = 'Please enter your table number';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Checking...';
    try {
      const { table } = await Api.get(`/api/tables/check/${encodeURIComponent(tableNumber)}`);
      setTable(table);
      window.location.href = 'menu.html';
    } catch (err) {
      errorMsg.textContent = err.message;
      btn.disabled = false;
      btn.textContent = 'Continue to Menu';
    }
  }

  btn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });

  // Already have an active table for this session? Offer a one-tap continue
  // instead of forcing re-entry — but still let them switch if they want to.
  if (existingTable && !prefill && !forceNew) {
    document.getElementById('formWrap').innerHTML = `
      <div class="card continue-card">
        <div style="font-size:13px;color:var(--color-ink-soft);">You're currently ordering for</div>
        <div class="continue-table-num">Table ${existingTable.table_number}</div>
        <button class="btn btn-primary btn-block" id="continueExistingBtn">Continue to Menu</button>
        <button class="switch-link" id="switchTableBtn">Order for a different table</button>
      </div>
    `;
    document.getElementById('continueExistingBtn').addEventListener('click', () => {
      window.location.href = 'menu.html';
    });
    document.getElementById('switchTableBtn').addEventListener('click', () => {
      window.location.href = 'index.html?newtable=1';
    });
    return;
  }

  if (prefill) document.getElementById('tableInput').value = prefill;
  if (prefill) submit();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Menu</title>
<link rel="stylesheet" href="css/theme.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  .cat-section { padding: 20px 20px 4px; scroll-margin-top: 110px; }
  .cat-title { font-size: 20px; margin-bottom: 14px; }
  .item-row {
    display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--color-line);
  }
  .item-row:last-child { border-bottom: none; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: 700; font-size: 15.5px; margin-bottom: 4px; }
  .item-desc { font-size: 13px; color: var(--color-ink-soft); margin-bottom: 8px; line-height: 1.4; }
  .item-price { font-weight: 700; font-size: 14.5px; }
  .item-photo-wrap {
    position: relative; width: 100px; height: 90px; flex-shrink: 0;
  }
  .item-photo {
    width: 100px; height: 90px; border-radius: 12px; object-fit: cover; background: var(--color-line);
  }
  .add-btn {
    position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
    background: var(--color-surface); border: 1.5px solid var(--color-primary); color: var(--color-primary);
    font-weight: 800; font-size: 13px; padding: 6px 18px; border-radius: var(--radius-pill);
    box-shadow: var(--shadow-card); white-space: nowrap;
  }
  .stepper {
    position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
    background: var(--color-primary); color: #fff; border-radius: var(--radius-pill);
    display: flex; align-items: center; gap: 10px; padding: 6px 10px; box-shadow: var(--shadow-card);
  }
  .stepper button { background: transparent; color: #fff; font-size: 16px; font-weight: 800; width: 18px; }
  .badges { display: flex; gap: 6px; margin-bottom: 6px; }
  .cart-bar {
    position: fixed; bottom: 62px; left: 0; right: 0; max-width: 520px; margin: 0 auto;
    background: var(--color-primary); color: #fff;
    padding: 14px 20px; display: none;
    align-items: center; justify-content: space-between;
    box-shadow: 0 -4px 14px rgba(0,0,0,0.12); z-index: 25;
  }
  @media (min-width: 900px) { .cart-bar { max-width: 720px; } }
  .cart-bar.visible { display: flex; }
  .cart-bar-info { font-size: 13px; opacity: 0.9; }
  .cart-bar-total { font-weight: 800; font-size: 16px; }
</style>
</head>
<body>
  <div class="container has-tab-bar">
    <div class="top-bar">
      <div>
        <div style="font-size:12px; opacity:0.85;">Ordering for</div>
        <div id="shopNameTop" style="font-weight:700; font-size:16px;">Restaurant</div>
      </div>
      <button class="table-chip-btn" id="tableChipBtn">Table -- <i data-lucide="pencil" class="icon-sm"></i></button>
    </div>

    <div class="menu-controls">
      <div class="search-bar-wrap">
        <div class="search-bar">
          <i data-lucide="search" class="icon"></i>
          <input id="searchInput" placeholder="Search for dishes...">
        </div>
      </div>
      <div class="chip-bar" id="chipBar"></div>
    </div>

    <div id="menuContainer"></div>
    <div class="empty-state" id="emptyState" style="display:none;">No dishes match your search.</div>

    <div class="cart-bar" id="cartBar" onclick="window.location.href='cart.html'">
      <div>
        <div class="cart-bar-total" id="cartBarCount">0 items</div>
        <div class="cart-bar-info" id="cartBarSubtotal">Rs. 0</div>
      </div>
      <button class="btn btn-accent">View Cart <i data-lucide="arrow-right" class="icon-sm"></i></button>
    </div>
  </div>

  <nav class="tab-bar" id="tabBar"></nav>

<script src="js/api.js"></script>
<script>
(async function() {
  let table = getTable();
  if (!table) { window.location.href = 'index.html'; return; }

  const shop = await applyShopTheme();
  if (shop) document.getElementById('shopNameTop').textContent = shop.name;
  document.getElementById('tableChipBtn').innerHTML = `Table ${table.table_number} <i data-lucide="pencil" class="icon-sm"></i>`;
  document.getElementById('tableChipBtn').addEventListener('click', () => openChangeTableModal(table.table_number));
  if (window.lucide) window.lucide.createIcons();

  renderTabBar('menu');

  let cart = getCart();
  let searchTerm = '';

  function qtyFor(itemId) {
    const line = cart.find((c) => c.menuItemId === itemId);
    return line ? line.quantity : 0;
  }

  function updateCartBar() {
    const count = cartCount(cart);
    const bar = document.getElementById('cartBar');
    if (count > 0) {
      bar.classList.add('visible');
      document.getElementById('cartBarCount').textContent = `${count} item${count > 1 ? 's' : ''} added`;
      document.getElementById('cartBarSubtotal').textContent = formatMoney(cartSubtotal(cart));
    } else {
      bar.classList.remove('visible');
    }
    renderTabBar('menu');
  }

  function changeQty(item, delta) {
    let line = cart.find((c) => c.menuItemId === item.id);
    if (!line && delta > 0) {
      cart.push({ menuItemId: item.id, name: item.name, price: item.price, quantity: 1 });
    } else if (line) {
      line.quantity += delta;
      if (line.quantity <= 0) cart = cart.filter((c) => c.menuItemId !== item.id);
    }
    setCart(cart);
    renderMenu();
    updateCartBar();
  }

  function filteredMenu() {
    const menu = window.__menuData || [];
    if (!searchTerm) return menu;
    const term = searchTerm.toLowerCase();
    return menu
      .map((cat) => ({ ...cat, items: cat.items.filter((it) => it.name.toLowerCase().includes(term)) }))
      .filter((cat) => cat.items.length > 0);
  }

  function renderChips(menu) {
    const chipBar = document.getElementById('chipBar');
    chipBar.innerHTML = menu.map((cat, i) => `<button class="chip ${i === 0 ? 'active' : ''}" data-cat="${cat.id}">${cat.name}</button>`).join('');
    chipBar.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        chipBar.querySelectorAll('.chip').forEach((c) => c.classList.remove('active'));
        chip.classList.add('active');
        const section = document.getElementById(`cat-${chip.dataset.cat}`);
        if (section) section.scrollIntoView({ behavior: 'smooth' });
      });
    });
  }

  function renderMenu() {
    const menu = filteredMenu();
    const container = document.getElementById('menuContainer');
    container.innerHTML = '';
    document.getElementById('emptyState').style.display = menu.length === 0 ? 'block' : 'none';

    menu.forEach((cat) => {
      const section = document.createElement('div');
      section.className = 'cat-section';
      section.id = `cat-${cat.id}`;
      const title = document.createElement('div');
      title.className = 'cat-title display';
      title.textContent = cat.name;
      section.appendChild(title);

      cat.items.forEach((item) => {
        const qty = qtyFor(item.id);
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div class="item-info">
            <div class="badges">
              ${item.is_seasonal ? '<span class="badge badge-seasonal">Seasonal</span>' : ''}
            </div>
            <div class="item-name">${item.name}</div>
            <div class="item-desc">${item.description || ''}</div>
            <div class="item-price">${formatMoney(item.price)}</div>
          </div>
          <div class="item-photo-wrap">
            <img class="item-photo" src="${item.image_url ? (window.API_BASE || '') + item.image_url : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200&q=60'}" alt="${item.name}">
            ${qty > 0
              ? `<div class="stepper"><button class="qty-minus">−</button><span>${qty}</span><button class="qty-plus">+</button></div>`
              : `<button class="add-btn">ADD</button>`}
          </div>
        `;
        const photoWrap = row.querySelector('.item-photo-wrap');
        const addBtn = photoWrap.querySelector('.add-btn');
        if (addBtn) addBtn.addEventListener('click', () => changeQty(item, 1));
        const minus = photoWrap.querySelector('.qty-minus');
        const plus = photoWrap.querySelector('.qty-plus');
        if (minus) minus.addEventListener('click', () => changeQty(item, -1));
        if (plus) plus.addEventListener('click', () => changeQty(item, 1));
        section.appendChild(row);
      });
      container.appendChild(section);
    });
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderMenu();
  });

  async function loadMenu() {
    try {
      const { menu } = await Api.get(`/api/menu?tableCategory=${table.category}`);
      window.__menuData = menu;
      renderChips(menu);
      renderMenu();
    } catch (err) {
      showToast(err.message);
    }
  }

  await loadMenu();
  updateCartBar();

  // Realtime sync: if the owner adds/edits/removes a dish, or its
  // availability changes, this page updates within moments - no refresh needed.
  const socket = listenForShopUpdates();
  if (socket) socket.on('menuUpdate', () => loadMenu());
})();
</script>
</body>
</html>

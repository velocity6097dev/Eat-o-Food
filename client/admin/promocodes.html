<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo Codes</title>
<link rel="stylesheet" href="css/admin.css">
<style>
  .rule-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .toggle-row { display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; margin-bottom:10px; }
</style>
</head>
<body>
  <div id="appShell"></div>

<script src="js/api.js"></script>
<script>
requireAuth();

function content() {
  return `
    <div class="page-head">
      <h1 class="page-title display">Promo Codes</h1>
      <button class="btn btn-primary" id="addBtn">+ New Code</button>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table>
        <thead><tr><th>Code</th><th>Discount</th><th>Rules</th><th>Used</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  `;
}

let promos = [];

async function load() {
  try { promos = await AdminApi.get('/api/admin/promocodes'); render(); }
  catch (err) { showToast(err.message); }
}

function ruleSummary(p) {
  const rules = [];
  if (p.first_n_customers) rules.push(`First ${p.first_n_customers} customers`);
  if (p.first_time_only) rules.push('First-time only');
  if (p.min_order_amount > 0) rules.push(`Min order ${formatMoney(p.min_order_amount)}`);
  if (p.total_usage_limit) rules.push(`Max ${p.total_usage_limit} uses`);
  return rules.join(', ') || '—';
}

function render() {
  document.getElementById('rows').innerHTML = promos.map((p) => `
    <tr>
      <td><strong>${p.code}</strong></td>
      <td>${p.discount_type === 'percentage' ? p.discount_value + '%' : formatMoney(p.discount_value)}${p.max_discount_amount ? ` (max ${formatMoney(p.max_discount_amount)})` : ''}</td>
      <td style="font-size:12.5px;color:var(--color-ink-soft);">${ruleSummary(p)}</td>
      <td>${p.used_count}</td>
      <td>${p.is_active ? '<span class="badge badge-paid">Active</span>' : '<span class="badge badge-declined">Disabled</span>'}</td>
      <td style="text-align:right; white-space:nowrap;">
        <button class="btn btn-outline btn-sm" data-toggle="${p.id}" data-active="${p.is_active}">${p.is_active ? 'Disable' : 'Enable'}</button>
        <button class="btn btn-danger btn-sm" data-del="${p.id}">Delete</button>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--color-ink-soft);padding:30px;">No promo codes yet</td></tr>';

  document.querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', () => toggleActive(b.dataset.toggle, b.dataset.active === 'true' || b.dataset.active === '1')));
  document.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => delPromo(b.dataset.del)));
}

async function toggleActive(id, currentlyActive) {
  try { await AdminApi.put(`/api/admin/promocodes/${id}`, { is_active: currentlyActive ? 0 : 1 }); load(); }
  catch (err) { showToast(err.message); }
}

async function delPromo(id) {
  if (!confirm('Delete this promo code?')) return;
  try { await AdminApi.del(`/api/admin/promocodes/${id}`); load(); } catch (err) { showToast(err.message); }
}

function openModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-head"><h3 class="display">New Promo Code</h3><button class="modal-close">×</button></div>

      <div class="field"><label class="field-label">Code</label><input class="input" id="mCode" placeholder="e.g. WELCOME50" style="text-transform:uppercase;"></div>

      <div class="field">
        <label class="field-label">Discount Type</label>
        <select id="mType"><option value="percentage">Percentage</option><option value="amount">Flat Amount</option></select>
      </div>
      <div class="rule-grid" style="margin-bottom:14px;">
        <div><label class="field-label">Value</label><input class="input" id="mValue" type="number" step="0.01" placeholder="e.g. 50"></div>
        <div><label class="field-label">Max Discount (₹, optional)</label><input class="input" id="mMaxDiscount" type="number" step="0.01" placeholder="Cap for % discounts"></div>
      </div>

      <div class="field"><label class="field-label">Minimum Order Amount</label><input class="input" id="mMinOrder" type="number" step="0.01" value="0"></div>

      <div class="toggle-row"><input type="checkbox" id="mFirstTime"> First-time customers only</div>

      <div class="field"><label class="field-label">Only valid for the shop's first N customers (optional)</label><input class="input" id="mFirstN" type="number" placeholder="e.g. 100"></div>
      <div class="field"><label class="field-label">Total usage limit (optional)</label><input class="input" id="mMaxUses" type="number" placeholder="e.g. 500"></div>

      <div class="rule-grid">
        <div><label class="field-label">Valid From (optional)</label><input class="input" id="mFrom" type="datetime-local"></div>
        <div><label class="field-label">Valid Until (optional)</label><input class="input" id="mTo" type="datetime-local"></div>
      </div>

      <button class="btn btn-primary btn-block" id="mSave" style="margin-top:16px;">Create Code</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('.modal-close').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  overlay.querySelector('#mSave').addEventListener('click', async () => {
    const code = document.getElementById('mCode').value.trim().toUpperCase();
    const discount_value = parseFloat(document.getElementById('mValue').value);
    if (!code || isNaN(discount_value)) { showToast('Code and discount value are required'); return; }
    const payload = {
      code,
      discount_type: document.getElementById('mType').value,
      discount_value,
      max_discount_amount: document.getElementById('mMaxDiscount').value ? parseFloat(document.getElementById('mMaxDiscount').value) : null,
      min_order_amount: parseFloat(document.getElementById('mMinOrder').value) || 0,
      first_time_only: document.getElementById('mFirstTime').checked,
      first_n_customers: document.getElementById('mFirstN').value ? parseInt(document.getElementById('mFirstN').value, 10) : null,
      total_usage_limit: document.getElementById('mMaxUses').value ? parseInt(document.getElementById('mMaxUses').value, 10) : null,
      valid_from: document.getElementById('mFrom').value || null,
      valid_to: document.getElementById('mTo').value || null
    };
    try {
      await AdminApi.post('/api/admin/promocodes', payload);
      overlay.remove();
      load();
    } catch (err) { showToast(err.message); }
  });
}

renderShell('promocodes', content());
document.getElementById('addBtn').addEventListener('click', openModal);
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>
<link rel="stylesheet" href="css/admin.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  .settings-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .settings-grid { grid-template-columns: 1fr; } }
  .color-row { display:flex; align-items:center; gap:12px; }
  .color-row input[type=color] { width: 48px; height: 40px; border-radius: 8px; border: 1.5px solid var(--color-line); padding: 2px; }
</style>
</head>
<body>
  <div id="appShell"></div>

<script src="js/api.js"></script>
<script>
requireAuth();

function content() {
  return `
    <div class="page-head"><h1 class="page-title display">Settings</h1></div>

    <div class="card" style="margin-bottom:16px;">
      <h3 class="display" style="font-size:17px;margin-bottom:16px;">Shop Details</h3>
      <div class="settings-grid">
        <div class="field"><label class="field-label">Shop Name</label><input class="input" id="sName"></div>
        <div class="field"><label class="field-label">Phone</label><input class="input" id="sPhone"></div>
      </div>
      <div class="field"><label class="field-label">Address</label><input class="input" id="sAddress"></div>
      <div class="settings-grid">
        <div class="field"><label class="field-label">Opening Time</label><input class="input" type="time" id="sOpen"></div>
        <div class="field"><label class="field-label">Closing Time</label><input class="input" type="time" id="sClose"></div>
      </div>
      <div class="field"><label class="field-label">Tax Percent (%)</label><input class="input" type="number" step="0.01" id="sTax"></div>
      <div class="settings-grid">
        <div class="field"><label class="field-label">Primary Theme Color</label>
          <div class="color-row"><input type="color" id="sTheme"><span id="sThemeHex" style="font-size:13px;color:var(--color-ink-soft);"></span></div>
        </div>
        <div class="field"><label class="field-label">Accent Color</label>
          <div class="color-row"><input type="color" id="sAccent"><span id="sAccentHex" style="font-size:13px;color:var(--color-ink-soft);"></span></div>
        </div>
      </div>
      <button class="btn btn-primary" id="saveBtn">Save Changes</button>
    </div>

    <div class="card">
      <h3 class="display" style="font-size:17px;margin-bottom:16px;">Change Password</h3>
      <div class="settings-grid">
        <div class="field"><label class="field-label">Current Password</label><input class="input" type="password" id="curPass"></div>
        <div class="field"><label class="field-label">New Password</label><input class="input" type="password" id="newPass"></div>
      </div>
      <button class="btn btn-outline" id="pwBtn">Change Password</button>
    </div>
  `;
}

async function load() {
  try {
    const s = await AdminApi.get('/api/shop');
    document.getElementById('sName').value = s.name || '';
    document.getElementById('sPhone').value = s.phone || '';
    document.getElementById('sAddress').value = s.address || '';
    document.getElementById('sOpen').value = (s.opening_time || '').slice(0,5);
    document.getElementById('sClose').value = (s.closing_time || '').slice(0,5);
    document.getElementById('sTax').value = s.tax_percent;
    document.getElementById('sTheme').value = s.theme_color;
    document.getElementById('sAccent').value = s.accent_color;
    document.getElementById('sThemeHex').textContent = s.theme_color;
    document.getElementById('sAccentHex').textContent = s.accent_color;
    document.documentElement.style.setProperty('--color-primary', s.theme_color);
    document.documentElement.style.setProperty('--color-accent', s.accent_color);
  } catch (err) { showToast(err.message); }
}

renderShell('settings', content());
load();

const socket = connectSocket();
if (socket) socket.on('shopUpdate', load);

document.addEventListener('input', (e) => {
  if (e.target.id === 'sTheme') document.getElementById('sThemeHex').textContent = e.target.value;
  if (e.target.id === 'sAccent') document.getElementById('sAccentHex').textContent = e.target.value;
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  try {
    await AdminApi.put('/api/admin/shop', {
      name: document.getElementById('sName').value.trim(),
      phone: document.getElementById('sPhone').value.trim(),
      address: document.getElementById('sAddress').value.trim(),
      opening_time: document.getElementById('sOpen').value,
      closing_time: document.getElementById('sClose').value,
      tax_percent: parseFloat(document.getElementById('sTax').value) || 0,
      theme_color: document.getElementById('sTheme').value,
      accent_color: document.getElementById('sAccent').value
    });
    showToast('Settings saved');
    load();
  } catch (err) { showToast(err.message); }
});

document.getElementById('pwBtn').addEventListener('click', async () => {
  const currentPassword = document.getElementById('curPass').value;
  const newPassword = document.getElementById('newPass').value;
  if (!currentPassword || !newPassword) { showToast('Fill both password fields'); return; }
  try {
    await AdminApi.post('/api/admin/change-password', { currentPassword, newPassword });
    showToast('Password changed');
    document.getElementById('curPass').value = '';
    document.getElementById('newPass').value = '';
  } catch (err) { showToast(err.message); }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link rel="stylesheet" href="css/admin.css">
<style>
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 380px; padding: 32px; }
  .login-logo { width: 56px; height: 56px; border-radius: 16px; background: var(--color-primary); margin: 0 auto 18px; display:flex; align-items:center; justify-content:center; }
  .login-title { text-align: center; font-size: 22px; margin-bottom: 4px; }
  .login-sub { text-align: center; color: var(--color-ink-soft); font-size: 13.5px; margin-bottom: 24px; }
  .error-msg { color: var(--color-danger); font-size: 13.5px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="login-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M3 8h18M3 8l1.5 12h15L21 8M3 8l2-5h14l2 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 class="login-title display">Admin Login</h1>
      <div class="login-sub">Manage tables, menu, and live orders</div>

      <div class="field">
        <label class="field-label">Username</label>
        <input class="input" id="username" placeholder="admin" autofocus>
      </div>
      <div class="field">
        <label class="field-label">Password</label>
        <input class="input" id="password" type="password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block" id="loginBtn">Log In</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

<script src="js/api.js"></script>
<script>
if (getToken()) window.location.href = 'dashboard.html';

const btn = document.getElementById('loginBtn');
const errorMsg = document.getElementById('errorMsg');

async function submit() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  errorMsg.textContent = '';
  if (!username || !password) { errorMsg.textContent = 'Enter username and password'; return; }
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    const res = await fetch(`${window.API_BASE}/api/admin/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    setToken(data.token);
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorMsg.textContent = err.message;
    btn.disabled = false; btn.textContent = 'Log In';
  }
}
btn.addEventListener('click', submit);
document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
